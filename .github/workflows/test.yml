name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod tidy
      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -race -timeout 1h ./...
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod tidy
      - name: Run coverage
        run: |
          go test -coverprofile=cov.out -covermode=atomic ./...
          go tool cover -func=cov.out | tail -1
  fuzz:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod tidy
      - name: Fuzz parser (short)
        run: go test -run=^$ -fuzz=FuzzParser_StandardNeverPanics -fuzztime=30s .
      - name: Fuzz Next vs linear scan (short)
        run: go test -run=^$ -fuzz=FuzzSpecScheduleNext -fuzztime=30s .

  coordination-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Workspace against HEAD core
        run: go work init . coordination/redis
      - name: Test
        working-directory: coordination/redis
        run: go test -race -timeout 10m ./...

  coordination-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CRON_PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Workspace against HEAD core
        run: go work init . coordination/postgres
      - name: Test
        working-directory: coordination/postgres
        run: go test -race -timeout 10m ./...

  contrib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Workspace against HEAD core
        run: go work init . contrib/prometheus contrib/otel
      - name: Test prometheus recorder
        working-directory: contrib/prometheus
        run: go test -race -timeout 10m ./...
      - name: Test otel wrapper
        working-directory: contrib/otel
        run: go test -race -timeout 10m ./...
